<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反问 · 总管面</title>
<style>
  :root{
    --bg:#f7f6f2; --card:#fff; --line:#e7e4dc; --ink:#1b1b18; --muted:#7c7a70;
    --red:#a53a24; --red-bg:#fbf0ec; --red-bar:#c2583b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 80px}

  .top{position:sticky;top:0;z-index:9;background:var(--bg);padding:10px 0 12px;
    border-bottom:1px solid var(--line);margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px}
  .back{font-size:12.5px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px;margin-bottom:18px;box-shadow:0 2px 6px rgba(0,0,0,.035)}

  .anchorbox{background:var(--red-bg);border-left:4px solid var(--red-bar);
    border-radius:12px;padding:13px 15px}
  .atag{display:block;font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--red);margin-bottom:5px}
  .anchorbox p{margin:0;font-size:15.5px;font-weight:700;color:var(--red);line-height:1.7}

  .list{margin:0;padding:0 0 0 20px}
  .list li{font-size:16.5px;line-height:1.9;margin-bottom:12px;color:#1b1b18}
  .list li:last-child{margin-bottom:0}
  .list b{color:var(--red)}

  .note{background:#faf9f5;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
  .note p{margin:0;font-size:13.5px;line-height:1.8;color:#3b3b35}

  .foot{margin-top:26px;font-size:10.5px;color:#a9a59b;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>反问</h1>
    <a class="back" href="index.html">‹ 列表</a>
  </div>

  <div class="card">
    <div class="anchorbox">
      <span class="atag">总管问</span>
      <p>你有什么想问我们的吗？</p>
    </div>
  </div>

  <div class="card">
    <div class="anchorbox">
      <span class="atag">开口第一句</span>
      <p>谢谢您今天的时间，聊下来学到很多。我有两个问题想请教一下。</p>
    </div>
  </div>

  <div class="card">
    <ol class="list">
      <li>咱们软件团队接下来一两年，最重要的事是什么？我想先了解一下方向。</li>
      <li>如果我进来了，前半年您希望我做到什么程度？</li>
      <li>想问一下，团队平时用 AI 工具，是鼓励大家自己摸索，还是有统一的规范？比如哪些地方必须人来把关。</li>
    </ol>
  </div>

  <div class="card">
    <div class="note">
      <p>问前两条。气氛好、还有时间，再问第三条。</p>
    </div>
  </div>

  <div class="foot">总管面 · 反问</div>
</div>
</body>
</html>
