<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>面试背记卡</title>
<style>
  :root{
    --bg:#f7f6f2; --card:#fff; --line:#e7e4dc; --ink:#1b1b18; --muted:#7c7a70;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:calc(32px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}

  .hd{margin-bottom:22px}
  h1{font-size:21px;margin:0 0 6px;font-weight:700;letter-spacing:.3px}
  .sub{font-size:12.5px;color:var(--muted);line-height:1.6}

  .entry{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:18px 16px;text-decoration:none;color:inherit;margin-bottom:10px;
    box-shadow:0 1px 4px rgba(0,0,0,.03);transition:transform .12s ease,border-color .12s ease}
  .entry:hover{border-color:#d5d0c4}
  .entry:active{transform:scale(.988)}
  .ico{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;font-size:17px;font-weight:700;color:#fff}
  .body{min-width:0;flex:1}
  .name{font-size:15.5px;font-weight:700;margin-bottom:3px}
  .desc{font-size:11.5px;color:var(--muted);line-height:1.5}
  .arrow{flex:0 0 auto;color:#c3bfb5;font-size:16px}

  .foot{margin-top:26px;font-size:10.5px;color:#a9a59b;text-align:center;line-height:1.7}
  .foot a{color:#a9a59b}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>面试背记卡</h1>
    <div class="sub">两个入口，各管一块。</div>
  </div>

  <a class="entry" href="projects/index.html">
    <div class="ico" style="background:linear-gradient(135deg,#2f9e63,#3b82b8)">项</div>
    <div class="body">
      <div class="name">项目</div>
      <div class="desc">32 张卡 · Agent / RAG / 工程 / 评测 / 模型</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="entry" href="harness/index.html">
    <div class="ico" style="background:linear-gradient(135deg,#1f6feb,#2f8f8a)">H</div>
    <div class="body">
      <div class="name">Harness 课程</div>
      <div class="desc">拆开重建模型之外的运行壳</div>
    </div>
    <div class="arrow">›</div>
  </a>

  <div class="foot">
    Learn Claude Code 内容来自
    <a href="https://github.com/shareAI-lab/learn-claude-code" target="_blank" rel="noopener">shareAI-lab/learn-claude-code</a>（MIT）
  </div>
</div>
</body>
</html>
